<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Automobile Billing & Invoice Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        :root{
            --primary:#072654;
            --secondary:#0d6efd;
            --accent:#ffc107;
            --light:#f8f9fa;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:
            linear-gradient(rgba(7,38,84,.85),rgba(13,110,253,.75)),
            url("{{ url_for('static', filename='images/in1.jpg') }}")
            center/cover no-repeat;
            font-family:'Segoe UI',sans-serif;
        }

        .login-card{
            width:420px;
            background:white;
            border-radius:20px;
            padding:40px;
            box-shadow:0 20px 50px rgba(0,0,0,.25);
            animation:fade .7s;
        }

        @keyframes fade{
            from{
                opacity:0;
                transform:translateY(30px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .logo{
            width:85px;
            height:85px;
            margin:auto;
            border-radius:50%;
            background:linear-gradient(135deg,var(--primary),var(--secondary));
            display:flex;
            align-items:center;
            justify-content:center;
            color:white;
            font-size:35px;
            margin-bottom:18px;
        }

        h2{
            color:var(--primary);
            font-weight:800;
        }

        .subtitle{
            color:#666;
            font-size:15px;
            margin-bottom:30px;
        }

        .form-label{
            font-weight:600;
            color:#333;
        }

        .form-control{
            border-radius:12px;
            height:48px;
        }

        .form-control:focus{
            border-color:var(--secondary);
            box-shadow:0 0 0 .2rem rgba(13,110,253,.2);
        }

        .btn-login{
            background:linear-gradient(135deg,var(--primary),var(--secondary));
            color:white;
            font-weight:600;
            border:none;
            border-radius:12px;
            height:48px;
            transition:.3s;
        }

        .btn-login:hover{
            transform:translateY(-2px);
            box-shadow:0 10px 20px rgba(0,0,0,.15);
        }

        .footer{
            margin-top:25px;
            text-align:center;
            color:#666;
            font-size:13px;
        }

        .system-title{
            font-size:18px;
            font-weight:700;
            color:var(--primary);
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="logo">
        <i class="fas fa-car"></i>
    </div>

    <div class="text-center">

        <div class="system-title">
            S.S AUTOS
        </div>

        <h2>Admin Login</h2>

        <p class="subtitle">
            Automobile Billing & Invoice Management System
        </p>

    </div>

    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                <i class="fas fa-user me-2"></i>Username
            </label>

            <input
                type="text"
                class="form-control"
                name="username"
                placeholder="Enter Username"
                required>

        </div>

        <div class="mb-4">

            <label class="form-label">
                <i class="fas fa-lock me-2"></i>Password
            </label>

            <input
                type="password"
                class="form-control"
                name="password"
                placeholder="Enter Password"
                required>

        </div>

        <button class="btn btn-login w-100">

            <i class="fas fa-sign-in-alt me-2"></i>
            Login

        </button>

    </form>

    {% if error %}
    <div class="alert alert-danger mt-3 text-center">
        {{ error }}
    </div>
    {% endif %}

    <div class="footer">
        © 2026 S.S AUTOS<br>
        Professional Billing Solution
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
